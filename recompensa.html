<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ice & Wellness — Recompensa</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{font-family:'Inter',sans-serif; background:#ECE6DA; display:flex; justify-content:center; align-items:flex-start;}
  a{color:inherit; text-decoration:none;}
  .serif{font-family:'Lora',serif;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
  @keyframes popIn{from{opacity:0; transform:scale(.6) rotate(-15deg);} to{opacity:1; transform:scale(1) rotate(0);}}
  @keyframes twinkle{0%,100%{transform:scale(1) rotate(0deg);} 50%{transform:scale(1.15) rotate(8deg);}}
  .screen{animation:fadeUp .5s cubic-bezier(.16,.8,.3,1);}
  .sparkle{animation:popIn .5s cubic-bezier(.34,1.56,.64,1) .1s backwards, twinkle 2.4s ease-in-out 1s infinite;}
  .cta{transition:transform .15s ease;}
  .cta:active{transform:scale(.97);}
  .screen{width:390px; height:844px; background:#243746; color:#fff; box-sizing:border-box; overflow:hidden; position:relative; display:flex; flex-direction:column;}
  @media (max-width:430px){ .screen{width:100vw; height:100vh;} body{align-items:stretch;} }
</style>
</head>
<body>

<div class="screen">

  <div style="position:absolute; width:220px; height:220px; border-radius:50%; background:#32475a; top:-90px; left:-90px;"></div>
  <div style="position:absolute; width:150px; height:150px; border-radius:50%; background:#32475a; bottom:130px; right:-60px;"></div>

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </a>
    <div style="width:34px;"></div>
  </div>

  <div style="position:relative; z-index:1; flex:1; text-align:center; padding:28px 26px 0;">
    <svg class="sparkle" width="46" height="46" viewBox="0 0 24 24" fill="#E8C86B" aria-hidden="true" style="margin:0 auto; display:block;">
      <path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8Z"/>
      <path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8Z"/>
    </svg>
    <h1 class="serif" style="font-size:28px; font-weight:600; margin-top:12px;">¡Felicidades!</h1>
    <p style="font-size:14px; color:#C9D2D6; margin-top:8px; line-height:1.5;">
      Completaste tus 5 envases.<br>Elige tu clase gratis:
    </p>

    <div style="display:flex; gap:12px; margin-top:26px;">
      <a href="compartir.html" class="cta" style="flex:1; background:#fff; border-radius:18px; overflow:hidden; color:#243746;">
        <div style="width:100%; height:110px; background:#EDEAD9; display:flex; align-items:center; justify-content:center;">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#8A8667" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19c8 0 14-5 16-15-10 1-15 6-16 15Z"/><path d="M5 18.5C9 15 12 11 14.5 6.5"/></svg>
        </div>
        <div style="padding:12px;">
          <div style="font-weight:700; font-size:13.5px;">Pilates</div>
          <div style="font-size:11px; color:#5B6B74; margin:4px 0 10px;">Mat · 45 min</div>
          <span style="display:block; background:#8A8667; color:#fff; font-weight:600; font-size:12px; padding:9px; border-radius:14px;">Elegir</span>
        </div>
      </a>
      <a href="compartir.html" class="cta" style="flex:1; background:#fff; border-radius:18px; overflow:hidden; color:#243746;">
        <div style="width:100%; height:110px; background:#D9E2D5; display:flex; align-items:center; justify-content:center;">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#6F8F6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17 10 9h5l3 8M10 9l2-4h3M12 9h6"/></svg>
        </div>
        <div style="padding:12px;">
          <div style="font-weight:700; font-size:13.5px;">Ciclismo</div>
          <div style="font-size:11px; color:#5B6B74; margin:4px 0 10px;">Indoor · 45 min</div>
          <span style="display:block; background:#8A8667; color:#fff; font-weight:600; font-size:12px; padding:9px; border-radius:14px;">Elegir</span>
        </div>
      </a>
    </div>

    <a href="inicio.html" style="display:inline-block; margin-top:26px; font-size:12.5px; color:#9FACB2; text-decoration:underline;">Ver después</a>
  </div>
</div>

</body>
</html>
