<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{font-family:'Inter',sans-serif; color:#4A3C22; background:#D9DEC8; display:flex; justify-content:center; align-items:flex-start;}
  a{color:inherit; text-decoration:none;}
  .serif{font-family:'Baloo 2','Poppins',sans-serif; font-weight:800; letter-spacing:.1px;}
  .wordmark{font-family:'Lora',serif; font-style:italic; font-weight:600; text-transform:lowercase; letter-spacing:.3px;}
  .tagline{font-family:'Lora',serif; font-style:italic;}
  .screen{position:relative; isolation:isolate;}
  .screen::before{content:"";position:absolute;inset:0;z-index:-1;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27160%27%20height%3D%27160%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.85%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20type%3D%27matrix%27%20values%3D%270%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200.05%200%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27%2F%3E%3C%2Fsvg%3E");pointer-events:none;}


  @keyframes fadeUp{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}
  @keyframes floatY{0%,100%{transform:translateY(0);} 50%{transform:translateY(-14px);}}
  @keyframes popIn{from{opacity:0; transform:scale(.5) rotate(-12deg);} to{opacity:1; transform:scale(1) rotate(0);}}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(125,110,69,.25);} 50%{box-shadow:0 0 0 14px rgba(125,110,69,0);}}
  @keyframes dotPulse{0%,100%{opacity:.3; transform:scale(1);} 50%{opacity:1; transform:scale(1.25);}}

  .fu{opacity:0; animation:fadeUp .7s cubic-bezier(.16,.8,.3,1) forwards;}
  .d1{animation-delay:.1s;} .d2{animation-delay:.35s;} .d3{animation-delay:.55s;} .d4{animation-delay:.75s;} .d5{animation-delay:.95s;}
  .float{animation:floatY 7s ease-in-out infinite;}
  .icwrap{opacity:0; animation:popIn .65s cubic-bezier(.34,1.56,.64,1) .1s forwards, glow 2.4s ease-in-out 1s infinite;}
  .dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:#7D6E45; animation:dotPulse 1.2s ease-in-out infinite;}
  .dot:nth-of-type(2){animation-delay:.15s;} .dot:nth-of-type(3){animation-delay:.3s;}
  .cta{transition:transform .15s ease;}
  .cta:active{transform:scale(.96);}

  .screen{width:390px; height:844px; background:radial-gradient(130% 90% at 8% -10%, rgba(255,255,255,.5), rgba(255,255,255,0) 55%), linear-gradient(160deg, #CFD8BC 0%, #E2E1D0 40%, #EEEBDE 70%, #D8DEC5 100%); box-sizing:border-box; overflow:hidden; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
  @media (max-width:430px){ .screen{width:100vw; height:100vh;} body{align-items:stretch;} }
</style>
</head>

      </svg>
