<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ice & Wellness</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{font-family:'Inter',sans-serif; color:#243746; background:#ECE6DA; display:flex; justify-content:center; align-items:flex-start;}
  a{color:inherit; text-decoration:none;}
  .serif{font-family:'Lora',serif;}

  @keyframes fadeUp{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}
  @keyframes floatY{0%,100%{transform:translateY(0);} 50%{transform:translateY(-14px);}}
  @keyframes popIn{from{opacity:0; transform:scale(.5) rotate(-12deg);} to{opacity:1; transform:scale(1) rotate(0);}}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(138,134,103,.25);} 50%{box-shadow:0 0 0 14px rgba(138,134,103,0);}}
  @keyframes dotPulse{0%,100%{opacity:.3; transform:scale(1);} 50%{opacity:1; transform:scale(1.25);}}

  .fu{opacity:0; animation:fadeUp .7s cubic-bezier(.16,.8,.3,1) forwards;}
  .d1{animation-delay:.1s;} .d2{animation-delay:.35s;} .d3{animation-delay:.55s;} .d4{animation-delay:.75s;} .d5{animation-delay:.95s;}
  .float{animation:floatY 7s ease-in-out infinite;}
  .icwrap{opacity:0; animation:popIn .65s cubic-bezier(.34,1.56,.64,1) .1s forwards, glow 2.4s ease-in-out 1s infinite;}
  .dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:#8A8667; animation:dotPulse 1.2s ease-in-out infinite;}
  .dot:nth-of-type(2){animation-delay:.15s;} .dot:nth-of-type(3){animation-delay:.3s;}
  .cta{transition:transform .15s ease;}
  .cta:active{transform:scale(.96);}

  .screen{width:390px; height:844px; background:#F4EFE6; box-sizing:border-box; overflow:hidden; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
  @media (max-width:430px){ .screen{width:100vw; height:100vh;} body{align-items:stretch;} }
</style>
</head>
<body>

<div class="screen">

  <div class="float" style="position:absolute; width:260px; height:260px; border-radius:50%; background:#D1E4F0; top:-110px; right:-90px;"></div>
  <div class="float" style="position:absolute; width:180px; height:180px; border-radius:50%; background:#F1D3D6; bottom:-70px; left:-70px; animation-delay:1s; animation-duration:8s;"></div>
  <div class="float" style="position:absolute; width:110px; height:110px; border-radius:50%; background:#EDEAD9; bottom:120px; right:-30px; animation-delay:.5s; animation-duration:6s;"></div>

  <div style="position:relative; z-index:1; padding:0 40px;">
    <div class="icwrap" style="width:84px; height:84px; border-radius:50%; background:#EDEAD9; color:#8A8667; display:flex; align-items:center; justify-content:center; margin:0 auto;">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8Z"/>
        <path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8Z"/>
      </svg>
    </div>

    <div class="fu d1" style="font-size:11.5px; letter-spacing:2.5px; text-transform:uppercase; color:#8A8667; font-weight:700; margin-top:22px;">Bienestar · Reciclaje · Recompensas</div>
    <h1 class="serif fu d2" style="font-size:40px; font-weight:600; margin:10px 0 0; line-height:1.1;">Ice &amp; Wellness</h1>
    <p class="serif fu d3" style="font-size:15px; font-style:italic; color:#5B6B74; margin:10px 0 0;">Cuidarse nunca se vió tan bien</p>

    <a href="descubre.html" class="cta fu d4" style="display:inline-flex; align-items:center; justify-content:center; gap:8px; background:#243746; color:#fff; font-weight:600; font-size:15px; padding:15px 34px; border-radius:30px; margin-top:34px;">
      Comenzar
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>

    <div class="fu d5" style="margin-top:20px; display:flex; gap:6px; justify-content:center;">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
  </div>
</div>

</body>
</html>
